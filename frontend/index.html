<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RupeeVoice Agent</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #637083;
        --line: #d8dee8;
        --brand: #0f7b67;
        --brand-dark: #07584a;
        --gold: #c98621;
        --bg: #f4f7f6;
        --panel: #ffffff;
        --soft: #e8f3ef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        min-height: 28vh;
        padding: 28px clamp(18px, 4vw, 52px);
        background:
          linear-gradient(90deg, rgba(8, 49, 43, .92), rgba(15, 123, 103, .72)),
          url("https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=1800&q=80") center/cover;
        color: white;
        display: flex;
        align-items: end;
      }
      .hero {
        max-width: 920px;
      }
      h1 {
        margin: 0;
        font-size: clamp(34px, 6vw, 72px);
        line-height: .95;
        letter-spacing: 0;
      }
      .hero p {
        max-width: 720px;
        margin: 16px 0 0;
        font-size: clamp(16px, 2vw, 20px);
      }
      main {
        width: min(1180px, calc(100% - 32px));
        margin: -22px auto 36px;
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 18px;
        align-items: start;
      }
      section, aside {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(34, 47, 62, .08);
      }
      aside { padding: 18px; }
      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 11px 12px;
        font: inherit;
        color: var(--ink);
        background: white;
      }
      textarea { min-height: 90px; resize: vertical; }
      button, .link-button {
        border: 0;
        border-radius: 6px;
        padding: 11px 14px;
        font-weight: 800;
        cursor: pointer;
        background: var(--brand);
        color: white;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      button.secondary, .link-button.secondary {
        background: #eef2f5;
        color: var(--ink);
      }
      button.warn { background: var(--gold); }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
      .chat { min-height: 620px; display: grid; grid-template-rows: auto 1fr auto; }
      .chat-head {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      .metric {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: end;
      }
      .pill {
        background: var(--soft);
        color: var(--brand-dark);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 800;
      }
      #messages {
        padding: 18px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 440px;
      }
      .msg {
        max-width: min(78%, 720px);
        border-radius: 8px;
        padding: 12px 14px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .agent { align-self: flex-start; background: #eef8f5; border: 1px solid #cce7df; }
      .lead { align-self: flex-end; background: #172033; color: white; }
      .composer {
        border-top: 1px solid var(--line);
        padding: 14px;
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
      }
      .summary {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }
      @media (max-width: 840px) {
        main { grid-template-columns: 1fr; margin-top: 16px; }
        .composer { grid-template-columns: 1fr; }
        .msg { max-width: 92%; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="hero">
        <h1>RupeeVoice</h1>
        <p>AI voice agent for multilingual AP partner lead conversion, objection handling, qualification, and RM handoff.</p>
      </div>
    </header>

    <main>
      <aside>
        <h2>Lead Setup</h2>
        <label for="name">Name</label>
        <input id="name" value="Amit Sharma" />
        <label for="phone">Phone</label>
        <input id="phone" value="+91 98765 43210" />
        <label for="city">City</label>
        <input id="city" value="Indore" />
        <label for="language">Preferred language</label>
        <select id="language">
          <option value="auto">Auto detect</option>
          <option value="en-IN">English</option>
          <option value="hi-IN">Hindi / Hinglish</option>
        </select>
        <div class="actions">
          <button id="startCall">Start Call</button>
          <a class="link-button secondary" href="/dashboard">Dashboard</a>
        </div>
        <div class="summary" id="summary">
          No conversation yet. Start with “Hello” or “Namaste”.
        </div>
      </aside>

      <section class="chat">
        <div class="chat-head">
          <div>
            <strong>Live Conversation</strong>
            <div style="color: var(--muted); font-size: 13px;">Browser voice demo with text fallback</div>
          </div>
          <div class="metric">
            <span class="pill" id="classPill">Cold</span>
            <span class="pill" id="scorePill">Score 30</span>
            <span class="pill" id="langPill">Auto</span>
          </div>
        </div>
        <div id="messages"></div>
        <form class="composer" id="chatForm">
          <input id="message" placeholder="Type lead response, or use mic..." autocomplete="off" />
          <button type="button" class="warn" id="mic">Mic</button>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script>
      const state = { sessionId: null, lastReply: "" };
      const $ = (id) => document.getElementById(id);

      function lead() {
        return {
          name: $("name").value || "Partner Lead",
          phone: $("phone").value,
          city: $("city").value,
          language: $("language").value,
          source: "Hackathon demo"
        };
      }

      function addMessage(role, text) {
        const box = document.createElement("div");
        box.className = `msg ${role}`;
        box.textContent = text;
        $("messages").appendChild(box);
        $("messages").scrollTop = $("messages").scrollHeight;
      }

      function speak(text, language) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = language || "en-IN";
        utterance.rate = 0.96;
        window.speechSynthesis.speak(utterance);
      }

      async function send(text) {
        if (!text.trim()) return;
        addMessage("lead", text.trim());
        $("message").value = "";
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: state.sessionId, lead: lead(), message: text.trim() })
        });
        const data = await response.json();
        state.sessionId = data.session_id;
        state.lastReply = data.reply;
        addMessage("agent", data.reply);
        $("classPill").textContent = data.classification;
        $("scorePill").textContent = `Score ${data.score}`;
        $("langPill").textContent = data.language;
        $("summary").innerHTML = `
          <strong>${data.classification}</strong><br>
          ${data.next_action}<br><br>
          Objections: ${data.objections.length ? data.objections.join(", ") : "None"}<br>
          Topics: ${data.summary.topics_covered.join(", ") || "Opening"}
        `;
        speak(data.reply, data.language);
      }

      $("startCall").addEventListener("click", () => {
        state.sessionId = null;
        $("messages").innerHTML = "";
        send($("language").value === "hi-IN" ? "Namaste, mujhe partner program ke baare mein bataye" : "Hello, tell me about the partner program");
      });

      $("chatForm").addEventListener("submit", (event) => {
        event.preventDefault();
        send($("message").value);
      });

      $("mic").addEventListener("click", () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Speech recognition is not available in this browser. Please type the response.");
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = $("language").value === "hi-IN" ? "hi-IN" : "en-IN";
        recognition.interimResults = false;
        recognition.onresult = (event) => send(event.results[0][0].transcript);
        recognition.start();
      });
    </script>
  </body>
</html>
